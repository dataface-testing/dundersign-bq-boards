# dbt charts project configuration for the Dundersign boards.
#
# The warehouse is BigQuery, project `internal-dataface-eng`. Boards read the
# `dundersign*` datasets; queries fully qualify the dataset so one source
# serves core, serving, and per-source tables alike.
#
# This source deliberately carries NO credential field.
#
# On dbt charts Cloud the source name maps to the `internal-dataface-eng`
# connection, which supplies the credential. Do not add `keyfile:` here: the
# whole `sources:` block is rendered through dbt Jinja at load time, so a
# `{{ env_var(...) }}` that is unset in the render environment does not fail
# that one key — it drops every source in the file, and the boards render as
# ERR-SOURCE-NOT-FOUND cards reading "Available sources: none configured".
#
# Locally, authenticate with Application Default Credentials instead:
#   export GOOGLE_APPLICATION_CREDENTIALS=/path/to/key.json   # outside the repo
# or `gcloud auth application-default login`.

sources:
  warehouse:
    type: bigquery
    project: internal-dataface-eng
    dataset: dundersign_serving
    location: us-east4
    keyfile: "{{ env_var('DCT_BQ_KEYFILE') }}"
